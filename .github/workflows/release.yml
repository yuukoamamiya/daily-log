name: Daily Log release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate release version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($tagVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $env:RELEASE_TAG"
          }
          $versionSource = Get-Content -Raw daily_log\version.py
          $versionMatch = [regex]::Match($versionSource, '__version__\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw 'Could not read __version__ from daily_log/version.py.'
          }
          $sourceVersion = $versionMatch.Groups[1].Value
          if ($sourceVersion -ne $tagVersion) {
            throw "Release tag $tagVersion does not match daily_log.version ($sourceVersion)."
          }
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run client tests
        env:
          PYTHONUTF8: "1"
        run: python -m unittest discover -s tests -v
      - name: Check module entry point
        run: python -m daily_log --help
      - name: Build desktop client
        run: pyinstaller --noconfirm --clean packaging/DailyLog.spec
      - name: Smoke test packaged executable
        run: .\dist\DailyLog\DailyLog.exe --smoke-test
      - name: Build portable client
        env:
          DAILY_LOG_BUILD_PORTABLE: "1"
        run: pyinstaller --noconfirm --clean --distpath dist\portable --workpath build\portable packaging/DailyLog.spec
      - name: Smoke test portable executable
        run: .\dist\portable\DailyLog\DailyLog.exe --smoke-test
      - name: Add human test launcher
        run: Copy-Item packaging\DailyLog-HumanTest.cmd dist\portable\DailyLog\DailyLog-HumanTest.cmd
      - name: Create portable package
        shell: pwsh
        run: Compress-Archive -Path .\dist\portable\DailyLog -DestinationPath .\dist\DailyLog-portable.zip
      - name: Build PortableApps package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          python packaging\portableapps.py --app-dir dist\portable\DailyLog --output-dir dist\portableapps --tools-dir build\portableapps-tools --version $tagVersion
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Create installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          iscc "/DAppVersion=$tagVersion" packaging\DailyLog.iss
      - name: Create checksums
        shell: pwsh
        run: Get-ChildItem .\dist\DailyLog-portable.zip, .\dist\DailyLog-Setup-*.exe, .\dist\portableapps\DailyLogPortable.zip, .\dist\portableapps\DailyLogPortable.paf.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Set-Content .\dist\SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/DailyLog-portable.zip
            dist/DailyLog-Setup-*.exe
            dist/portableapps/DailyLogPortable.zip
            dist/portableapps/DailyLogPortable.paf.exe
            dist/SHA256SUMS.txt
